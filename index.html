<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chicago Union Attendance - CloudApper Tile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
 --ink:#69270A;
 --ink-2:#4A1B07;
 --teal:#C68A3D;
 --teal-light:#F6EBD9;
 --gold:#C1440E;
 --gold-light:#FBEAE0;
 --gold-ink:#9A3412;
 --rust:#EE3124;
 --rust-light:#FDE4E1;
 --canvas:#F7F2EE;
 --card:#FFFFFF;
 --border:#E8DDD3;
 --text:#2B1B12;
 --muted:#6B5C50;
 --muted-2:#74655A;
 --teal-text:#8A5A12;
 --rust-text:#B8231A;
 --radius:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{ width:100%; }
  body{
    font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
    background:var(--canvas);
    color:var(--text);
 -webkit-font-smoothing:antialiased;
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    padding:20px clamp(12px, 3vw, 32px) 60px clamp(12px, 3vw, 32px);
  }
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  button{font-family:inherit;cursor:pointer;}

  /* ================= TILE ================= */
  .tile{
    width:100%;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(20,30,50,.04), 0 10px 28px rgba(20,30,50,.07);
    overflow:visible;
  }

  .tile-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:18px 20px 14px 20px;
  }
  .tile-head .title-block{display:flex;gap:11px;align-items:flex-start;}
  .tile-icon{
    width:34px;height:34px;border-radius:9px;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .tile-icon svg{width:18px;height:18px;color:#fff;}
  .tile-head h1{font-size:15.5px;font-weight:700;color:var(--ink);margin:0 0 2px 0;}
  .tile-head p{font-size:11.5px;color:var(--muted);margin:0;}

  /* ---- tab bar ---- */
  .tab-bar{
    display:flex;gap:16px;
    padding:0 20px;
    border-bottom:1px solid var(--border);
  }
  .tab-btn{
    background:none;border:none;
    padding:10px 14px 11px 14px;
    font-size:12.5px;font-weight:600;color:var(--muted);
    border-bottom:2px solid transparent;
    display:flex;align-items:center;gap:6px;
    margin-bottom:-1px;
  }
  .tab-btn svg{width:14px;height:14px;}
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--ink);border-bottom-color:var(--ink);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  @media (max-width: 560px){
    .tab-bar{padding:0 16px;overflow-x:auto;}
    .tab-btn{padding:9px 10px 10px 10px;font-size:11.5px;white-space:nowrap;}
  }

  .head-actions{display:flex;align-items:center;gap:6px;}
  .sync-pill{
    display:flex;align-items:center;gap:6px;
    background:var(--teal-light);color:var(--teal);
    border:none;border-radius:100px;padding:5px 11px 5px 9px;
    font-size:11px;font-weight:600;
  }
  .sync-pill svg{width:11px;height:11px;}
  .sync-pill.spin svg{animation:spin .6s linear;}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}



  /* ---- sub row: employee search + open tickets ---- */
  .sub-row{
    display:flex;align-items:flex-start;justify-content:space-between;
    padding:16px 20px 14px 20px;
    gap:12px;
    position:relative;
    flex-wrap:wrap;
  }
  .search-wrap{ position:relative; flex:1; min-width:200px; max-width:380px; }
  .sub-tools{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .emp-search{
    display:flex;align-items:center;gap:8px;
    background:#F7F8FA;border:1px solid var(--border);border-radius:9px;
    padding:8px 11px;width:100%;
  }
  .emp-search.focused{border-color:var(--teal); background:#fff; box-shadow:0 0 0 3px var(--teal-light);}
  .emp-search svg{width:14px;height:14px;color:var(--muted-2);flex-shrink:0;}
  .emp-search input{
    border:none;outline:none;background:transparent;font-family:inherit;
    font-size:12.5px;color:var(--text);width:100%;font-weight:500;
  }
  .emp-search input::placeholder{color:var(--muted-2);font-weight:400;}
  .emp-search .clear-btn{
    background:none;border:none;color:var(--muted-2);width:16px;height:16px;
    flex-shrink:0;display:none;align-items:center;justify-content:center;
  }
  .emp-search .clear-btn.show{display:flex;}
  .emp-search .clear-btn svg{width:12px;height:12px;}

  .emp-menu{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:#fff;border:1px solid var(--border);border-radius:10px;
    box-shadow:0 8px 24px rgba(20,30,50,.14);
    padding:6px;z-index:40;display:none;
    max-height:280px; overflow-y:auto;
  }
  .emp-menu.open{display:block;}
  .emp-menu .opt{
    display:flex;flex-direction:column;gap:1px;width:100%;
    background:none;border:none;text-align:left;padding:8px 10px;border-radius:7px;
  }
  .emp-menu .opt:hover{background:#F2F4F7;}
  .emp-menu .opt .n{font-size:12.5px;font-weight:600;color:var(--text);}
  .emp-menu .opt .s{font-size:11px;color:var(--muted-2);}
  .emp-menu .opt.active{background:var(--teal-light);}
  .emp-menu .opt.active .n{color:var(--teal);}
  .emp-menu .empty{padding:10px;font-size:12px;color:var(--muted-2);}
  .emp-menu mark{background:var(--gold-light);color:inherit;border-radius:3px;padding:0 1px;}

  .tickets-badge{
    display:flex;align-items:center;gap:6px;flex-shrink:0;
    background:#fff;border:1px solid var(--border);border-radius:100px;
    padding:8px 13px;font-size:11.5px;font-weight:600;color:var(--text);
    height:fit-content;
  }
  .tickets-badge svg{width:12px;height:12px;color:var(--muted);}
  .tickets-badge:hover{background:#F7F8FA;}

  .emp-tool-btn{
    display:flex;align-items:center;gap:6px;flex-shrink:0;
    background:#fff;border:1px solid var(--border);border-radius:100px;
    padding:8px 13px;font-size:11.5px;font-weight:600;color:var(--muted);
    height:fit-content;
  }
  .emp-tool-btn svg{width:12px;height:12px;}
  .emp-tool-btn:hover{background:#F7F8FA;color:var(--ink);}
  .emp-tool-btn.spin svg{animation:spin .6s linear;}

  /* ================= RESPONSIVE ================= */
  @media (max-width: 560px){
    .tile-head{padding:16px 16px 12px 16px;flex-wrap:wrap;gap:10px;}
    .sub-row{padding:0 16px 12px 16px;}
    .identity{margin:0 16px 12px 16px;}
    .tracks{margin:0 16px 4px 16px;}
    .sso-note{padding:0 16px 14px 16px;}
    .search-wrap{max-width:none;flex-basis:100%;}
    .sub-tools{flex-basis:100%;justify-content:flex-start;}
    .t-count{display:none;}
    .track-row{flex-wrap:wrap;row-gap:6px;}
    .t-mid{flex-basis:calc(100% - 46px);}
  }
  @media (max-width: 380px){
    .tile-head h1{font-size:14px;}
    .tile-head p{display:none;}
    .modal{max-width:100%;}
  }

  /* ---- identity ---- */
  .identity{
    display:flex;align-items:center;gap:12px;
    margin:0 20px 14px 20px;
    padding:13px 14px;
    background:#F7F8FA;
    border-radius:10px;
  }
  .avatar{
    width:40px;height:40px;border-radius:50%;
    background:var(--ink);color:#fff;font-weight:700;font-size:14px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    border:none;
  }
  .avatar:hover{background:var(--ink-2);}
  .id-text{flex:1;min-width:0;background:none;border:none;text-align:left;padding:0;}
  .id-text .name{font-size:13.5px;font-weight:700;color:var(--ink);}
  .id-text .sub{font-size:11px;color:var(--muted);margin-top:1px;}
  .id-chevron{color:var(--muted-2);width:14px;height:14px;flex-shrink:0;}

  /* ---- HR flag banner ---- */

  /* ---- tracks ---- */
  .tracks{margin:0 20px 4px 20px;display:flex;flex-direction:column;gap:8px;}
  .track{
    border:1px solid var(--border);border-radius:10px;overflow:hidden;
  }
  .track-row{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;background:#fff;border:none;width:100%;text-align:left;
  }
  .track-row:hover{background:#FAFBFC;}
  .t-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .t-icon svg{width:14px;height:14px;}
  .t-mid{flex:1;min-width:0;}
  .t-name{font-size:10.5px;font-weight:700;color:var(--muted-2);letter-spacing:.4px;margin-bottom:2px;}
  .t-level{font-size:13.5px;font-weight:700;}
  .t-ladder{display:flex;gap:2.5px;margin-top:7px;}
  .t-ladder .seg{height:5px;flex:1;border-radius:3px;background:#E9EBEF;}
  .t-ladder .seg.passed{background:#C9CFDA;}
  .t-ladder .seg.cur-ok{background:var(--teal);}
  .t-ladder .seg.cur-mid{background:var(--gold);}
  .t-ladder .seg.cur-crit{background:var(--rust);}
  .t-count{font-size:11px;color:var(--muted);text-align:right;flex-shrink:0;min-width:64px;}
  .t-count b{color:var(--text);font-weight:700;}
  .t-chevron{width:15px;height:15px;color:var(--muted-2);flex-shrink:0;transition:transform .15s;}
  .track.open .t-chevron{transform:rotate(180deg);}

  .t-detail{
    max-height:0; overflow:hidden;
    background:#FAFBFC;
    border-top:1px solid transparent;
    transition:max-height .2s ease;
  }
  .track.open .t-detail{max-height:640px;border-top:1px solid var(--border);overflow-y:auto;}
  .t-detail-inner{padding:12px 14px 14px 14px;}
  .occ-row{
    display:flex;align-items:center;gap:10px;
    padding:7px 0;font-size:12px;
  }
  .occ-row + .occ-row{border-top:1px dashed #E3E6EA;}
  .occ-date{color:var(--muted);width:64px;flex-shrink:0;}
  .occ-change{flex:1;color:var(--text);}
  .occ-ticket{
    background:none;border:none;color:var(--teal);font-weight:600;font-size:11.5px;
    text-decoration:underline;text-underline-offset:2px;flex-shrink:0;
  }
  .occ-status{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;flex-shrink:0;}
  .occ-status.excused{background:#EDEFF2;color:var(--muted);}

  .notes-block{margin-top:10px;padding-top:10px;border-top:1px dashed #E3E6EA;}
  .notes-label{font-size:10.5px;font-weight:700;color:var(--muted-2);letter-spacing:.4px;margin-bottom:6px;}
  .note-row{background:var(--gold-light);border-radius:8px;padding:8px 10px;margin-bottom:6px;}
  .note-row:last-child{margin-bottom:0;}
  .note-meta{font-size:10.5px;color:var(--gold-ink);font-weight:600;margin-bottom:2px;}
  .note-text{font-size:12px;color:var(--text);line-height:1.4;}

  .t-actions{display:flex;gap:8px;margin-top:10px;}
  .t-btn{
    font-size:11.5px;font-weight:600;border-radius:7px;padding:7px 10px;
    border:1px solid var(--border);background:#fff;color:var(--text);
    display:flex;align-items:center;gap:6px;
  }
  .t-btn:hover{background:#F2F4F7;}
  .t-btn svg{width:12px;height:12px;}
  .t-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
  .t-btn.primary:hover{background:var(--ink-2);}

  /* ---- footer ---- */

  .sso-note{
    display:flex;align-items:center;gap:7px;
    font-size:10.5px;color:var(--muted-2);
    padding:0 20px 16px 20px;
  }
  .sso-note svg{width:12px;height:12px;flex-shrink:0;}

  /* ---- By Level tab ---- */
  .track-pills{display:flex;gap:8px;padding:16px 20px 6px 20px;flex-wrap:wrap;}
  .track-pill-btn{
    display:flex;align-items:center;gap:7px;
    padding:7px 13px;border-radius:100px;border:1px solid var(--border);
    background:#fff;font-size:12px;font-weight:600;color:var(--muted);
  }
  .track-pill-btn svg{width:13px;height:13px;}
  .track-pill-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}

  .level-groups{padding:12px 20px 18px 20px;display:flex;flex-direction:column;gap:12px;}
  .level-group{border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .level-group-head{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;
  }
  .level-group-head .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .level-group-head .lg-title{font-size:13px;font-weight:700;flex:1;}
  .level-group-head .lg-count{font-size:11px;color:var(--muted);font-weight:600;}
  .level-group-body{border-top:1px solid var(--border);}
  .lg-emp-row{
    display:flex;align-items:center;gap:10px;
    padding:9px 14px;width:100%;background:#fff;border:none;text-align:left;
  }
  .lg-emp-row:hover{background:#FAFBFC;}
  .lg-emp-row + .lg-emp-row{border-top:1px dashed #E7E9EC;}
  .lg-avatar{
    width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;
    font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .lg-emp-name{font-size:12.5px;font-weight:600;color:var(--text);}
  .lg-emp-sub{font-size:10.5px;color:var(--muted-2);}
  .lg-arrow{margin-left:auto;width:13px;height:13px;color:var(--muted-2);flex-shrink:0;}
  .level-empty{padding:28px 20px;text-align:center;color:var(--muted);font-size:12.5px;}

  /* ---- Daily Activity tab ---- */
  .date-nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px 12px 20px;
  }
  .date-nav .dn-mid{display:flex;flex-direction:column;align-items:center;}
  .dn-quick-row{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .dn-date-pick{
    display:flex;align-items:center;gap:5px;
    border:1px solid var(--border);border-radius:7px;
    padding:4px 8px;background:#F7F8FA;cursor:pointer;
    color:var(--muted);
  }
  .dn-date-pick svg{width:12px;height:12px;flex-shrink:0;}
  .dn-date-pick input[type="date"]{
    border:none;background:transparent;font-family:inherit;
    font-size:11px;color:var(--text);padding:0;width:100px;cursor:pointer;
  }
  .date-nav .dn-date{font-size:14px;font-weight:700;color:var(--ink);}
  .date-nav .dn-sub{font-size:10.5px;color:var(--muted-2);margin-top:1px;}
  .dn-btn{
    width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;
    display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;
  }
  .dn-btn:hover{background:#F2F4F7;}
  .dn-btn:disabled{opacity:.4;cursor:default;}
  .dn-btn svg{width:14px;height:14px;}
  .dn-today-btn{
    font-size:11px;font-weight:600;color:var(--teal);background:none;border:none;margin-top:2px;
  }

  .daily-list{padding:0 20px 6px 20px;display:flex;flex-direction:column;}
  .daily-row{
    display:flex;align-items:center;gap:12px;padding:11px 0;
    border-top:1px solid var(--border);
  }
  .daily-row:first-child{border-top:none;}
  .daily-row .dr-emp{flex:1;min-width:0;}
  .daily-row .dr-emp-name{font-size:12.5px;font-weight:600;color:var(--text);}
  .daily-row .dr-emp-sub{font-size:10.5px;color:var(--muted-2);}
  .daily-row .dr-change{flex:2;font-size:12px;color:var(--text);min-width:0;}
  .daily-empty{padding:32px 20px;text-align:center;color:var(--muted);font-size:12.5px;}

  .daily-foot{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px 16px 20px;border-top:1px solid var(--border);margin-top:8px;
  }
  .daily-foot .dcount{font-size:11.5px;color:var(--muted);}

  /* ---- mode toggle & range picker ---- */
  .mode-toggle{display:flex;gap:8px;padding:16px 20px 0 20px;}
  .mode-btn{
    padding:7px 14px;border-radius:100px;border:1px solid var(--border);
    background:#fff;font-size:12px;font-weight:600;color:var(--muted);
  }
  .mode-btn.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .mode-btn:hover:not(.active){background:#F7F8FA;}

  .range-nav{
    display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;
    padding:14px 20px 4px 20px;
  }
  .range-field{display:flex;flex-direction:column;gap:4px;}
  .range-field label{font-size:10.5px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.4px;}
  .range-field input[type="date"]{
    border:1px solid var(--border);border-radius:8px;padding:7px 10px;
    font-family:inherit;font-size:12.5px;color:var(--text);background:#F7F8FA;
  }
  .range-apply-btn{
    background:var(--ink);color:#fff;border:none;border-radius:8px;
    padding:9px 15px;font-size:12px;font-weight:600;height:fit-content;
  }
  .range-apply-btn:hover{background:var(--ink-2);}
  .range-summary{
    padding:12px 20px 0 20px;font-size:12.5px;font-weight:600;color:var(--ink);
  }
  @media (max-width: 560px){
    .mode-toggle{padding:14px 16px 0 16px;}
    .range-nav{padding:12px 16px 4px 16px;}
    .range-summary{padding:10px 16px 0 16px;}
  }

  .export-actions{display:flex;gap:8px;}
  .export-btn{
    background:var(--ink);color:#fff;border:none;border-radius:8px;
    padding:8px 12px;font-size:11.5px;font-weight:600;
    display:flex;align-items:center;gap:5px;
  }
  .export-btn:hover{background:var(--ink-2);}
  .export-btn svg{width:12px;height:12px;}
  .export-btn:disabled{opacity:.45;cursor:default;}
  .export-btn#exportExcelBtn{background:#1D6F42;}
  .export-btn#exportExcelBtn:hover{background:#175934;}
  .export-btn#exportPdfBtn{background:#B3261E;}
  .export-btn#exportPdfBtn:hover{background:#8f1e18;}
  @media (max-width: 560px){
    .daily-foot{flex-wrap:wrap;}
    .export-actions{flex-basis:100%;justify-content:flex-start;}
  }

  

  /* ================= MODAL ================= */
  .overlay{
    position:fixed;inset:0;background:rgba(15,22,36,.44);
    display:none;align-items:center;justify-content:center;z-index:100;
    padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:#fff;border-radius:14px;max-width:460px;width:100%;
    box-shadow:0 20px 60px rgba(10,16,30,.3);
    overflow:hidden;
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px;border-bottom:1px solid var(--border);
  }
  .modal-head h3{margin:0;font-size:14.5px;font-weight:700;color:var(--ink);}
  .modal-close{background:none;border:none;color:var(--muted);width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
  .modal-close:hover{background:#F2F4F7;}
  .modal-close svg{width:15px;height:15px;}
  .modal-body{padding:16px 18px;max-height:56vh;overflow-y:auto;}
  .modal-foot{padding:12px 18px 16px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border);}

  .mrow{display:flex;justify-content:space-between;padding:8px 0;font-size:12.5px;border-bottom:1px dashed #E7E9EC;}
  .mrow:last-child{border-bottom:none;}
  .mrow .k{color:var(--muted);}
  .mrow .v{font-weight:600;color:var(--text);text-align:right;}

  .audit-list .occ-row{padding:9px 0;}

  .btn{border:none;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:600;}
  .btn.primary{background:var(--ink);color:#fff;}
  .btn.primary:hover{background:var(--ink-2);}
  .btn.ghost{background:#fff;border:1px solid var(--border);color:var(--text);}
  .btn.ghost:hover{background:#F2F4F7;}

  /* ================= TOAST ================= */
  #toast-wrap{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:200;}
  .toast{
    background:var(--ink);color:#fff;font-size:12.5px;font-weight:500;
    padding:11px 16px;border-radius:9px;box-shadow:0 10px 26px rgba(10,16,30,.28);
    display:flex;align-items:center;gap:9px;
    opacity:0;transform:translateY(8px);
    animation:toast-in .25s ease forwards;
    max-width:320px;
  }
  .toast svg{width:15px;height:15px;flex-shrink:0;color:#8FE3C7;}
  @keyframes toast-in{to{opacity:1;transform:translateY(0);}}

  /* ---- ticket status pills (TRI lifecycle) ---- */
  .occ-status.new{background:var(--teal-light);color:var(--gold-ink);}
  .occ-status.sent{background:var(--gold-light);color:var(--gold-ink);}
  .occ-status.hr{background:#EFE4DC;color:var(--ink);}
  .occ-status.complete{background:#E3F1E8;color:#2E6B47;}

  /* ---- Communication tab ---- */
  .comm-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:16px 20px 0 20px;}
  .seg{display:flex;gap:3px;background:#F3EDE8;border-radius:9px;padding:3px;}
  .seg button{border:none;background:none;padding:6px 13px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);}
  .seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(60,30,10,.12);}
  .comm-hint{font-size:11px;color:var(--muted-2);}
  .comm-chips{display:flex;gap:6px;flex-wrap:wrap;padding:12px 20px 0 20px;}
  .chip{border:1px solid var(--border);background:#fff;border-radius:100px;padding:5px 11px;font-size:11.5px;font-weight:600;color:var(--muted);}
  .chip b{color:var(--ink);margin-left:3px;}
  .chip:hover{background:#F7F2EE;}
  .chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
  .chip.active b{color:#fff;}
  .bulk-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px 10px 20px;}
  .bulk-bar label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer;}
  .bulk-count{font-size:11.5px;color:var(--muted-2);}
  .bulk-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
  .bbtn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 10px;font-size:11.5px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:5px;}
  .bbtn svg{width:12px;height:12px;}
  .bbtn:hover:not(:disabled){background:#F7F2EE;}
  .bbtn.primary{background:var(--ink);border-color:var(--ink);color:#fff;}
  .bbtn.primary:hover:not(:disabled){background:var(--ink-2);}
  .bbtn:disabled{opacity:.4;cursor:default;}
  .comm-list{padding:0 20px 16px 20px;display:flex;flex-direction:column;gap:8px;}
  .comm-card{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:#fff;}
  .comm-head{display:flex;align-items:center;gap:10px;padding:11px 14px;}
  .comm-head input[type="checkbox"], .bulk-bar input[type="checkbox"]{width:15px;height:15px;accent-color:var(--ink);flex-shrink:0;cursor:pointer;}
  .comm-main{flex:1;min-width:0;cursor:pointer;background:none;border:none;text-align:left;padding:0;}
  .comm-title{font-size:12.5px;font-weight:700;color:var(--text);}
  .comm-title .tn{font-family:'IBM Plex Mono',monospace;font-weight:500;color:var(--teal);margin-right:6px;}
  .comm-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .comm-sub .late{color:var(--rust);font-weight:600;}
  .comm-card .t-chevron{width:15px;height:15px;color:var(--muted-2);flex-shrink:0;transition:transform .15s;cursor:pointer;}
  .comm-card.open .t-chevron{transform:rotate(180deg);}
  .comm-body{display:none;border-top:1px solid var(--border);padding:14px 14px 14px 14px;background:#FAF7F4;}
  .comm-card.open .comm-body{display:block;}
  .timeline{margin:0 0 12px 8px;padding-left:20px;border-left:2px solid #E8DDD3;}
  .tl-item{position:relative;padding-bottom:11px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-dot{position:absolute;left:-31px;top:0;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;color:var(--teal);}
  .tl-dot svg{width:9px;height:9px;}
  .tl-dot.t-complete{border-color:#2E6B47;color:#2E6B47;}
  .tl-dot.t-reminder{border-color:var(--gold);color:var(--gold);}
  .tl-dot.t-excused{border-color:var(--muted-2);color:var(--muted-2);}
  .tl-text{font-size:12px;color:var(--text);line-height:1.35;}
  .tl-meta{font-size:10.5px;color:var(--muted-2);margin-top:1px;}
  .comm-actions{display:flex;gap:7px;flex-wrap:wrap;}
  .comm-empty{padding:30px 20px;text-align:center;color:var(--muted);font-size:12.5px;}

  .email-list{padding:14px 20px 16px 20px;display:flex;flex-direction:column;gap:8px;}
  .email-row{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;padding:11px 14px;background:#fff;}
  .email-ico{width:30px;height:30px;border-radius:8px;background:var(--teal-light);color:var(--gold-ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .email-ico svg{width:15px;height:15px;}
  .email-main{flex:1;min-width:0;}
  .email-title{font-size:12.5px;font-weight:700;color:var(--text);}
  .email-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .email-preview{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.5;color:var(--text);}
  .email-head{font-size:11.5px;color:var(--muted);margin-bottom:10px;line-height:1.6;}
  .email-head b{color:var(--text);}
  .email-line{margin:0 0 6px 0;}

  .form-row{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .form-row label{font-size:11px;font-weight:700;color:var(--muted-2);}
  .form-row select{border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-family:inherit;font-size:13px;background:#F7F8FA;color:var(--text);}
  @media (max-width: 560px){
    .comm-top{padding:14px 16px 0 16px;}
    .comm-chips{padding:10px 16px 0 16px;}
    .bulk-bar{padding:10px 16px 8px 16px;}
    .comm-list{padding:0 16px 14px 16px;}
    .email-list{padding:12px 16px 14px 16px;}
    .bulk-actions{margin-left:0;width:100%;}
  }
  

  /* ---- print packets (HTML pages mirroring the PDF; printed through the browser dialog) ---- */
  #printArea{display:none;}
  .pk-page{position:relative;width:612pt;height:792pt;overflow:hidden;background:#fff;color:#000;font-family:Helvetica,Arial,'Liberation Sans',sans-serif;break-after:page;page-break-after:always;}
  .pk-page:last-child{break-after:auto;page-break-after:auto;}
  .pk-t{position:absolute;white-space:nowrap;}
  .pk-l{position:absolute;border-top:0.9pt solid #000;height:0;}
  .pk-tbl{position:absolute;border-collapse:collapse;table-layout:fixed;}
  .pk-tbl th,.pk-tbl td{border:0.7pt solid #000;padding:3.5pt;text-align:left;vertical-align:top;overflow-wrap:anywhere;}
  .pk-tbl th{font-weight:700;}
  .pk-tbl .r{text-align:right;}
  .pk-tbl.plain th,.pk-tbl.plain td{border:none;padding:2pt;}
  .pk-tbl.plain th{background:#000;color:#fff;font-weight:400;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .pk-cell{position:absolute;box-sizing:border-box;border:0.7pt solid #000;overflow:hidden;}
  .pk-cell.wk{background:#c8c8c8;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .pk-cell .dn{position:absolute;left:3pt;top:2.6pt;font-size:7.5pt;line-height:8pt;}
  .pk-cell .ev{position:absolute;left:3pt;right:3pt;top:12.2pt;font-size:6.4pt;line-height:7.2pt;}
  @media print{
    @page{size:letter;margin:0;}
    html,body{background:#fff !important;margin:0 !important;padding:0 !important;display:block !important;min-height:0 !important;}
    body.printing > :not(#printArea){display:none !important;}
    body.printing #printArea{display:block;}
  }


  /* ================================================================
     v6: accessibility, tap targets, embed mode, dialogs, paging
     ================================================================ */
  html.modal-open{overflow:hidden;}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .emp-search input:focus-visible,.comm-search input:focus-visible{outline:none;}
  .emp-search:focus-within,.comm-search:focus-within{border-color:var(--teal);background:#fff;box-shadow:0 0 0 3px var(--teal-light);}
  .tab-btn:focus-visible{outline-offset:-2px;border-radius:6px;}

  /* readable text colors on white and tinted backgrounds */
  .sync-pill,.emp-menu .opt.active .n,.occ-ticket,.dn-today-btn,.comm-title .tn{color:var(--teal-text);}
  .comm-sub .late{color:var(--rust-text);}
  .tl-dot.t-reminder{color:var(--gold-ink);border-color:var(--gold-ink);}

  /* header settings button */
  .hbtn{width:32px;height:32px;border-radius:100px;border:1px solid var(--border);background:#fff;color:var(--muted);display:flex;align-items:center;justify-content:center;padding:0;}
  .hbtn svg{width:15px;height:15px;}
  .hbtn:hover{background:#F7F2EE;color:var(--ink);}
  .sync-pill{min-height:32px;}

  /* tap targets */
  .chip{min-height:32px;padding:6px 12px;}
  .bbtn{min-height:34px;}
  .seg button{min-height:32px;}
  .mode-btn,.track-pill-btn{min-height:34px;}
  .t-btn{min-height:34px;}
  .dn-btn{width:34px;height:34px;}
  .dn-date-pick{min-height:34px;}
  .emp-tool-btn,.tickets-badge{min-height:34px;}
  .export-btn{min-height:36px;}
  .emp-search{min-height:36px;cursor:text;}
  .emp-search .clear-btn{width:28px;height:28px;margin:-6px -6px -6px 0;border-radius:6px;}
  .occ-ticket{min-height:32px;padding:0 4px;display:inline-flex;align-items:center;}
  .modal-close{width:32px;height:32px;}
  .sel-box{display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin:-8px 0 -8px -10px;cursor:pointer;flex-shrink:0;}
  .sel-box input{margin:0;}
  .bulk-bar label{min-height:32px;}
  @media (pointer:coarse){
    .chip,.bbtn,.mode-btn,.track-pill-btn,.t-btn,.emp-tool-btn,.tickets-badge,.export-btn,.occ-ticket,.pref-link{min-height:40px;}
    .dn-btn{width:40px;height:40px;}
  }

  /* narrow widths: allow rows to wrap instead of overflowing */
  .occ-row{flex-wrap:wrap;row-gap:4px;}
  .occ-row .occ-change{flex:1 1 150px;min-width:0;overflow-wrap:break-word;}
  .daily-row{flex-wrap:wrap;row-gap:4px;}
  .daily-row .dr-change{flex:2 1 150px;min-width:0;overflow-wrap:break-word;}
  .daily-row .dr-emp{flex:1 1 130px;min-width:0;overflow-wrap:break-word;}
  .lg-emp-name,.comm-title{overflow-wrap:break-word;}
  .comm-card{min-width:0;}
  .bulk-actions .bbtn .lbl-more{display:inline;}

  @media (max-width: 560px){
    /* header: title and controls share one row; the title wraps instead of pushing controls down */
    .tile-head{flex-wrap:nowrap;gap:10px;}
    .tile-head .title-block{flex:1 1 auto;min-width:0;}
    .tile-head .head-actions{flex:0 0 auto;}
  }
  @media (max-width: 420px){
    /* tabs: all four fit without sideways scrolling */
    .tab-bar{padding:0 6px;gap:0;}
    .tab-btn{padding:10px 8px 11px 8px;font-size:11.5px;white-space:nowrap;}
    .tab-btn svg,.tab-more{display:none;}
    /* rows: change text drops under the employee, ticket and status */
    .daily-row .dr-emp{flex:1 1 0;}
    .daily-row .dr-change{flex:1 1 100%;order:5;}
    .occ-row .occ-change{flex:1 1 100%;order:5;}
    /* communication cards: status pill moves under the title so names never break mid-word */
    .comm-head{display:grid;grid-template-columns:auto 1fr auto;column-gap:8px;row-gap:6px;align-items:start;padding:10px 10px 10px 12px;}
    .comm-head .sel-box{grid-column:1;grid-row:1;}
    .comm-head .comm-main{grid-column:2;grid-row:1;}
    .comm-head .t-chevron{grid-column:3;grid-row:1;margin-top:8px;}
    .comm-head .occ-status{grid-column:2;grid-row:2;justify-self:start;}
    /* bulk actions: compact three-up row */
    .bulk-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;margin-left:0;}
    .bulk-actions .bbtn{justify-content:center;padding:7px 6px;font-size:11.5px;}
    .bulk-actions .bbtn svg,.bulk-actions .bbtn .lbl-more{display:none;}
    .daily-foot{flex-wrap:wrap;gap:12px;}
    .export-actions{width:100%;}
    .export-actions .export-btn{flex:1;justify-content:center;}
  }
  /* modals fit short embeds */
  .modal{max-height:calc(100vh - 40px);display:flex;flex-direction:column;}
  .modal-body{flex:1;max-height:none;overflow-y:auto;}
  #toast-wrap{z-index:400;}
  @media (max-width: 480px){ #toast-wrap{left:12px;right:12px;bottom:12px;} .toast{max-width:none;} }

  /* embed mode (inside an iframe or ?embed=1): host supplies the frame */
  html.embedded body{padding:0;background:transparent;min-height:0;}
  html.embedded .tile{border:0;border-radius:0;box-shadow:none;}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important;}
  }

  /* print preference links */
  .pref-link{background:none;border:none;color:var(--muted);font-size:11.5px;padding:6px 4px;min-height:32px;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;}
  .pref-link b{color:var(--ink);font-weight:700;}
  .pref-link:hover{color:var(--ink);}
  .daily-foot .left{display:flex;flex-direction:column;align-items:flex-start;gap:0;}

  /* stacked dialog layer (replaces native confirm/prompt, which embedded frames block) */
  .dlg-overlay{z-index:300;}
  .dlg{max-width:440px;}
  .dlg-msg{margin:0;font-size:13px;line-height:1.5;color:var(--text);}
  .dlg-hint{font-size:11.5px;color:var(--muted);margin:8px 0 0 0;line-height:1.45;}
  .form-row textarea,.form-row input[type="text"],.form-row input[type="datetime-local"]{border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-family:inherit;font-size:13px;background:#F7F8FA;color:var(--text);width:100%;}
  .form-row textarea{resize:vertical;min-height:84px;}
  .remember{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--muted);cursor:pointer;min-height:32px;}
  .remember input{accent-color:var(--ink);width:16px;height:16px;}
  .opt-card{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer;background:#fff;}
  .opt-card.sel{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset;background:#FBF7F3;}
  .opt-card input{margin-top:2px;accent-color:var(--ink);width:16px;height:16px;flex-shrink:0;}
  .opt-card .t{font-size:12.5px;font-weight:700;color:var(--text);}
  .opt-card .d{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4;}

  /* Communication: search and paging */
  .comm-search{display:flex;align-items:center;gap:8px;margin:12px 20px 0 20px;border:1px solid var(--border);border-radius:9px;background:#F7F8FA;padding:0 11px;min-height:38px;}
  .comm-search svg{width:14px;height:14px;color:var(--muted-2);flex-shrink:0;}
  .comm-search input{border:none;outline:none;background:transparent;font-family:inherit;font-size:12.5px;color:var(--text);width:100%;min-height:34px;}
  .pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:2px 20px 16px 20px;}
  .pager .info{font-size:11.5px;color:var(--muted);}
  .pager-btns{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);}
  @media (max-width: 560px){ .comm-search{margin:10px 16px 0 16px;} .pager{padding:2px 16px 14px 16px;} }

  .emp-menu .opt.kb{background:#F2F4F7;outline:2px solid var(--ink);outline-offset:-2px;}


  /* ================================================================
     v7: built for about 500 employees (dashboard, filters, pagers)
     ================================================================ */
  [hidden]{display:none !important;}
  .st-badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:100px;vertical-align:1px;white-space:nowrap;}
  .st-badge.layoff{background:var(--gold-light);color:var(--gold-ink);}
  .st-badge.terminated{background:#EDEFF2;color:var(--muted);}
  .menu-hint{padding:8px 10px;font-size:11.5px;color:var(--muted);line-height:1.4;}

  /* pager */
  .pager{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:10px 20px 16px 20px;}
  .pager-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .pager .info{font-size:11.5px;color:var(--muted);}
  .pg-size{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .pg-size select{border:1px solid var(--border);border-radius:7px;padding:4px 6px;font-family:inherit;font-size:11.5px;background:#fff;color:var(--text);min-height:32px;}
  .pager-nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
  .pg-btn{min-width:32px;height:32px;padding:0 8px;border:1px solid var(--border);background:#fff;border-radius:7px;font-size:12px;font-weight:600;color:var(--text);}
  .pg-btn:hover:not(:disabled){background:#F7F2EE;}
  .pg-btn.cur{background:var(--ink);border-color:var(--ink);color:#fff;}
  .pg-btn:disabled{opacity:.4;cursor:default;}
  .pg-gap{color:var(--muted);padding:0 2px;}
  .pg-mini{display:none;font-size:11.5px;color:var(--muted);padding:0 6px;}
  @media (max-width: 560px){ .pg-num,.pg-gap{display:none;} .pg-mini{display:inline;} .pager{padding:8px 16px 14px 16px;} }

  /* sticky bulk bar so the actions stay in reach on long pages */
  .bulk-bar{position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid var(--border);}

  /* daily emails tools */
  .email-tools{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:12px 20px 0 20px;}
  .email-tools label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px;min-height:32px;}
  .email-tools input[type="checkbox"]{accent-color:var(--ink);width:16px;height:16px;}
  .email-tools input[type="date"]{border:1px solid var(--border);border-radius:7px;padding:4px 8px;font-family:inherit;font-size:12px;background:#F7F8FA;color:var(--text);min-height:34px;}
  @media (max-width: 560px){ .email-tools{padding:10px 16px 0 16px;} }

  /* By Level dashboard */
  .bl-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 20px 0 20px;}
  .kpi{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-height:84px;}
  .kpi:hover{background:#FBF7F3;}
  .kpi[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset;background:#FBF7F3;}
  .kpi .v{font-size:24px;font-weight:800;color:var(--ink);line-height:1.1;}
  .kpi .l{font-size:11.5px;font-weight:700;color:var(--text);margin-top:4px;}
  .kpi .s{font-size:11px;color:var(--muted);margin-top:1px;line-height:1.3;}
  .bl-dist{margin:12px 20px 0 20px;border:1px solid var(--border);border-radius:10px;padding:8px 10px 6px 10px;background:#fff;}
  .bl-dist h4{margin:2px 4px 6px 4px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .dist-row{display:grid;grid-template-columns:58px minmax(130px,210px) 1fr 38px;grid-template-areas:"lab name bar n";align-items:center;gap:8px;width:100%;background:none;border:none;text-align:left;padding:4px 6px;border-radius:7px;min-height:32px;}
  .dist-row:hover{background:#FBF7F3;}
  .dist-row[aria-pressed="true"]{background:#F6EBD9;}
  .dist-row .d-lab{grid-area:lab;font-size:12px;font-weight:700;color:var(--text);}
  .dist-row .d-name{grid-area:name;font-size:11.5px;color:var(--muted);}
  .dist-row .d-bar{grid-area:bar;height:10px;background:#F1EAE4;border-radius:100px;overflow:hidden;}
  .dist-row .d-bar i{display:block;height:100%;border-radius:100px;min-width:2px;}
  .dist-row .d-n{grid-area:n;font-size:12.5px;font-weight:700;text-align:right;color:var(--text);}
  .dist-zero{border-top:1px dashed var(--border);border-radius:0 0 7px 7px;margin-top:2px;}
  .bl-filters{padding:12px 20px 0 20px;}
  .bl-selects{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px;}
  .bl-selects .sel{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .bl-selects .sel span{font-size:10.5px;font-weight:700;color:var(--muted);}
  .bl-selects select{border:1px solid var(--border);border-radius:8px;padding:7px 8px;font-family:inherit;font-size:12px;background:#F7F8FA;color:var(--text);min-height:36px;width:100%;min-width:0;}
  .bl-activebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;}
  .bl-activebar:empty{display:none;}

  .lvl-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;white-space:nowrap;}

const LOG_ICON = { email: 'mail', hr: 'shield', printed: 'print', sent: 'send', reminder: 'bell', returned: 'inbox', complete: 'check', meeting: 'users', excused: 'ban' };

function remind(t) { addLog(t, 'reminder', t.sup, 'Email', 'Reminder to return signed copy'); }
function completeTicket(t) {
  if (t.status === 'sent') addLog(t, 'returned', '', 'Internal mail', 'Signed copy returned', t.sup);
  addLog(t, 'complete', '', 'Tile', 'Marked complete');
  t.status = 'complete';
  touch();
}

/* ================================================================
   PRINT LAYOUT (HTML pages, same coordinates as the PDF packet)

function px(n) { return (Math.round(n * 100) / 100) + 'pt'; }

  const off = (lh - 1.117 * s) / 2 + 0.905 * s;       // baseline offset inside a line box
  const pos = o.align === 'c' ? 'left:' + px(x) + ';transform:translateX(-50%);' : o.align === 'r' ? 'right:' + px(612 - x) + ';' : 'left:' + px(x) + ';';
  return '<div class="pk-t" style="' + pos + 'top:' + px(y - off) + ';font-size:' + px(s) + ';line-height:' + px(lh) + ';' + (o.bold ? 'font-weight:700;' : '') + (o.w ? 'width:' + px(o.w) + ';white-space:normal;' : '') + '">' + html + '</div>';
}
function pline(x1, x2, y, w) { return '<div class="pk-l" style="left:' + px(x1) + ';top:' + px(y) + ';width:' + px(x2 - x1) + ';border-top-width:' + px(w) + ';"></div>'; }
function ptable(x, y, widths, head, rows, o) {

  const th = head.map(function (h, i) { return '<th class="' + (right.indexOf(i) > -1 ? 'r' : '') + '" style="width:' + px(widths[i]) + ';">' + esc(h) + '</th>'; }).join('');
  const tr = rows.map(function (r) { return '<tr>' + r.map(function (c, i) { return '<td class="' + (right.indexOf(i) > -1 ? 'r' : '') + '">' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('');
  return '<table class="pk-tbl ' + (o.cls || '') + '" style="left:' + px(x) + ';top:' + px(y) + ';width:' + px(w) + ';font-size:' + px(o.s) + ';"><thead><tr>' + th + '</tr></thead><tbody>' + tr + '</tbody></table>';
}
function pageOf(inner) { return '<section class="pk-page">' + inner + '</section>'; }

const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function monthPageHTML(cal, md, e, pageNo, total, stamp) {
  let h = calHeaderHTML(e, pageNo, total, stamp);

  const x0 = 50, w = 512 / 7, y0 = 190;
  WEEKDAYS.forEach(function (n, i) { h += ptxt(x0 + i * w + 3, 180, n, { s: 9.5 }); });
  const first = md.getDay(), dim = new Date(md.getFullYear(), md.getMonth() + 1, 0).getDate();
  const rows = Math.ceil((first + dim) / 7), rh = Math.min(112, (748 - y0) / rows);
  for (let d = 1; d <= dim; d++) {
    const idx = first + d - 1, col = idx % 7, row = Math.floor(idx / 7);

    if (c.inactive) lines.push('*Inactive');
    c.items.forEach(function (it) { if (it.disc) lines.push('Disc. ID ' + it.disc); lines.push(labelText(it.label)); });
    h += '<div class="pk-cell' + (col === 0 || col === 6 ? ' wk' : '') + '" style="left:' + px(x0 + col * w) + ';top:' + px(y0 + row * rh) + ';width:' + px(w) + ';height:' + px(rh) + ';">' +
      '<span class="dn">' + pad2(d) + '</span><div class="ev">' + lines.map(esc).join('<br>') + '</div></div>';

  return pageOf(h);
}
function eventSummaryHTML(cal, e, gdate, pageNo, total, stamp) {

  h += ptxt(306, 150, esc(monthTitle(gdate)), { s: 15, align: 'c' });
  WEEKDAYS.forEach(function (n, i) { h += ptxt(50 + i * (512 / 7) + 3, 180, n, { s: 9.5 }); });
  const body = Object.keys(cal.counts).filter(function (k) { return CAL_EVENT[k]; })
    .sort(function (a, b) { return CAL_EVENT[a][0].localeCompare(CAL_EVENT[b][0]); })
    .map(function (k) { return [CAL_EVENT[k][0], CAL_EVENT[k][1], cal.counts[k].toFixed(1)]; });
  h += ptable(50, 192, [210, 200, 102], ['Event', 'Description', 'Occurrences'], body, { s: 9, cls: 'plain', right: [2] });

      mdyyyy(upd) + ' 22:00:' + pad2(10 + (Number(r.disc) % 49)), r.amount === 1 ? 'CHI_DISCIPLINE_BALANCE' : 'CHI_DISCIPLINE_BALANCE_REDUCE'];
  });
  h += ptable(40, 140, [36, 56, 66, 36, 106, 88, 142], ['Disc ID', 'Posting Date', 'Balance Code', 'Amount', 'Level Data', 'Update Date', 'Updated By'], body, { s: 7.5, cls: 'plain' });
  return pageOf(h);

function buildPrintHTML(list, withCal) {
  const n = new Date();
  const stamp = { date: mdyyyy(pd(TODAY)), time: ((n.getHours() % 12) || 12) + ':' + pad2(n.getMinutes()) + ':' + pad2(n.getSeconds()) };
  let out = '';
  list.forEach(function (t) {
    out += noticeHTML(t) + historyHTML(t);
    if (withCal) {
      const cal = calendarFor(t.emp, t.gen), e = EMP[t.emp], total = cal.months.length + 2;
      cal.months.forEach(function (md, i) { out += monthPageHTML(cal, md, e, i + 1, total, stamp); });
      out += eventSummaryHTML(cal, e, cal.months[cal.months.length - 1], total - 1, total, stamp);
      out += discDetailHTML(cal, e, total, total, stamp);
    }
  });
  return out;

/* ================================================================
   ATTENDANCE CALENDAR DATA (page 3 onward of the packet)
   ================================================================ */
function nthWeekday(year, month, weekday, n) {
  let c = 0;
  for (let d = 1; d <= 31; d++) { const dt = new Date(year, month, d); if (dt.getMonth() !== month) break; if (dt.getDay() === weekday && ++c === n) return d; }
}
function lastWeekday(year, month, weekday) {
  for (let d = 31; d >= 1; d--) { const dt = new Date(year, month, d); if (dt.getMonth() === month && dt.getDay() === weekday) return d; }
}
function easterSunday(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, month - 1, day);
}
function holidaysFor(y) {
  const h = {};
  const set = function (dt, name) { h[dkey(dt)] = name; };
  set(new Date(y, 0, 1), "New Year's Day");
  set(new Date(y, 0, nthWeekday(y, 0, 1, 3)), 'Martin Luther King Day');
  const gf = easterSunday(y); gf.setDate(gf.getDate() - 2); set(gf, 'Good Friday');
  set(new Date(y, 4, lastWeekday(y, 4, 1)), 'Memorial Day');
  const j4 = new Date(y, 6, 4), dw = j4.getDay();
  set(dw === 6 ? new Date(y, 6, 3) : dw === 0 ? new Date(y, 6, 5) : j4, 'Independence Day');
  set(new Date(y, 8, nthWeekday(y, 8, 1, 1)), 'Labor Day');
  set(new Date(y, 9, nthWeekday(y, 9, 1, 2)), 'Columbus Day');
  const tg = nthWeekday(y, 10, 4, 4);
  set(new Date(y, 10, tg), 'Thanksgiving Day');
  set(new Date(y, 10, tg + 1), 'Day After Thanksgiving');
  set(new Date(y, 11, 24), 'Christmas Eve');
  set(new Date(y, 11, 25), 'Christmas Day');
  return h;
}
function labelText(l) { return (l === 'Excused Absence' || l === 'Excused Tardy') ? l + ' (HR Approved - HR Approved)' : l; }
const CAL_EVENT = {
  'Absence': ['CHI Plant Absence', 'Absence'], 'Early Departure': ['CHI Plant Early Departure', 'Early Departure'],
  'Excused Absence': ['CHI Plant Excused Absence', 'Excused Absence'], 'Excused Medical': ['CHI Plant Excused Medical', 'Excused Medical'],
  'Excused Tardy': ['CHI Plant Excused Tardy', 'Excused Tardy'], 'Tardy': ['CHI Plant Late Arrival', 'Tardy'], 'Suspension': ['CHI Plant Suspension', 'Suspension']
};
const CAL_CACHE = {};
function calendarFor(empId, gen) {
  const ck = empId + '|' + gen.slice(0, 2) + gen.slice(6);
  if (CAL_CACHE[ck]) return CAL_CACHE[ck];
  const e = EMP[empId], g = pd(gen);
  const months = [];
  for (let i = 17; i >= 0; i--) months.push(new Date(g.getFullYear(), g.getMonth() - i, 1));
  const start = months[0], end = new Date(g.getFullYear(), g.getMonth() + 1, 0);
  const days = {}, counts = {};
  const cellOf = function (dt) { const k = dkey(dt); return days[k] || (days[k] = { items: [] }); };
  const inWin = function (dt) { return dt >= start && dt <= end; };
  const tally = function (l) { counts[l] = (counts[l] || 0) + 1; };
  for (let y = start.getFullYear(); y <= end.getFullYear(); y++) {
    const h = holidaysFor(y);
    Object.keys(h).forEach(function (k) { const dt = fromKey(k); if (inWin(dt)) cellOf(dt).hol = h[k]; });
  }
  (e.inactive || []).forEach(function (r) {
    for (let dt = pd(r[0]); dt <= pd(r[1]); dt.setDate(dt.getDate() + 1)) { if (inWin(dt)) cellOf(dt).inactive = true; }
  });
  const isWork = function (dt) { const c = days[dkey(dt)] || {}; return dt.getDay() !== 0 && dt.getDay() !== 6 && !c.hol && !c.inactive; };
  const disc = discFor(empId);
  disc.forEach(function (h) {
    const post = pd(h.post);
    if (h.amount === 1) {
      h.trig.forEach(function (d, i) {
        const dt = pd(d);
        if (!inWin(dt)) return;
        cellOf(dt).items.push({ disc: i === h.trig.length - 1 ? h.disc : null, label: TRACKS[h.track].cal });
        tally(TRACKS[h.track].cal);
      });
      const sd = { 3: 2, 4: 1, 5: 5, 6: 10 }[h.level];
      if (sd && daysBetween(h.post, TODAY) >= 14) {
        const dt = pd(addDays(h.post, 9));
        for (let n = 0; n < sd;) {
          if (isWork(dt) && inWin(dt)) { cellOf(dt).items.push({ label: 'Suspension' }); tally('Suspension'); n++; }
          else if (!inWin(dt)) break;
          dt.setDate(dt.getDate() + 1);
        }
      }
    } else if (inWin(post)) {
      cellOf(post).items.push({ disc: h.disc, label: 'Reduced by 1.0' });
    }
  });
  const r = mulberry32(Number(empId) * 131 + 17);
  const types = [['Absence', 0.18], ['Tardy', 0.22], ['Early Departure', 0.15], ['Excused Absence', 0.20], ['Excused Medical', 0.15], ['Excused Tardy', 0.10]];
  const last = new Date(Math.min(end.getTime(), pd(TODAY).getTime()));
  for (let dt = new Date(start); dt <= last; dt.setDate(dt.getDate() + 1)) {
    if (dt.getDay() === 0 || dt.getDay() === 6) continue;
    const c = days[dkey(dt)];
    if (c && (c.hol || c.inactive || c.items.length)) continue;
    if (r() < 0.035) {
      const x = r(); let acc = 0, label = types[0][0];
      for (let i = 0; i < types.length; i++) { acc += types[i][1]; if (x <= acc) { label = types[i][0]; break; } }
      cellOf(dt).items.push({ label: label }); tally(label);
    }
  }
  const inRows = disc.filter(function (h) { return inWin(pd(h.post)); });
  return (CAL_CACHE[ck] = { months: months, days: days, counts: counts, disc: inRows });
}

/* ================================================================
   PDF PACKETS IN TRI FORMAT
   page 1: Attendance Warning Notice, page 2: Attendance Level History,

    trk.push([Number(t.id), t.emp, EMP[t.emp].name, TRACKS[t.track].word, t.lvl, t.lvl <= 3 ? t.sup : 'HR managed', STATUS_LABEL[t.status], s ? s.ts.split(' ')[0] : '', c ? c.ts.split(' ')[0] : '', t.log.filter(function (e) { return e.type === 'reminder'; }).length]);
  });
  add('Distribution Tracker', trk, [10, 11, 20, 16, 7, 18, 16, 18, 12, 10]);
  XLSX.writeFile(wb, listFileName(live, 'xlsx'));
  toast('Excel file downloaded (' + live.length + ' ticket' + (live.length === 1 ? '' : 's') + ').');
  }).catch(libError);
}

/* ================================================================
   EVENTS
   ================================================================ */
document.addEventListener('click', function (e) {
  const T = e.target;
  const q = function (sel) { return T.closest(sel); };

  const tabBtn = q('.tab-btn');
  if (tabBtn) { switchTab(tabBtn.dataset.tab); return; }

  // ----- print settings, paging, search helpers
  if (q('[data-open-print-settings]')) { showPrintSettings(); return; }
  const pg = q('[data-pager]');
  if (pg) {
    const kind = pg.dataset.pager, to = Number(pg.dataset.goto);
    if (kind === 'email') { state.emailPage = to; renderComm(); } else if (kind === 'comm') { state.commPage = to; renderComm(); }
    else if (kind === 'bl') { state.blPage = to; renderByLevel(); } else { state.dailyPage = to; renderDaily(); }
    const top = document.getElementById({ comm: 'commSearch', email: 'emailList', bl: 'blKpis', daily: 'dailyList' }[kind]);
    if (top && top.getBoundingClientRect().top < 0) top.scrollIntoView({ block: 'start' });
    return;
  }
  if (q('#bulkAllMatching')) { commFiltered().forEach(function (t) { state.commSel.add(t.id); }); renderComm(); return; }
  if (q('#bulkClear')) { state.commSel.clear(); renderComm(); return; }
  if (q('#commClear')) { state.commQuery = ''; document.getElementById('commSearch').value = ''; state.commPage = 0; renderComm(); return; }
  if (q('#dlgClose') || T.id === 'dlgOverlay') { cancelDialog(); return; }
  if (q('.emp-search') && !q('.clear-btn')) { document.getElementById('empSearchInput').focus(); }

  // ----- ticket detail from anywhere
  const open = q('[data-ticket-open]');
  if (open) { showTicketModal(open.dataset.ticketOpen); return; }

  // ----- by level
  const lp = q('[data-level-track]');
  if (lp) { state.levelTrack = lp.dataset.levelTrack; state.blPage = 0; renderByLevel(); return; }
  const bl = q('[data-bl-level]');
  if (bl) { const v = bl.dataset.blLevel, nv = v === 'all' ? null : /^\d$/.test(v) ? Number(v) : v; state.blLevel = state.blLevel === nv ? null : nv; state.blPage = 0; renderByLevel(); return; }
  const bc = q('[data-bl-clear]');
  if (bc) {
    if (bc.dataset.blClear === 'all') { state.blLevel = null; state.blQuery = ''; state.blDept = ''; state.blShift = ''; state.blSup = ''; state.blStatus = 'Active'; document.getElementById('blSearch').value = ''; }
    else state.blLevel = null;
    state.blPage = 0; renderByLevel(); return;
  }
  const go = q('[data-goto-emp]');
  if (go) { state.currentEmp = Number(go.dataset.gotoEmp); touchRecent(state.currentEmp); state.openTracks = {}; state.searchFocused = false; switchTab('employee'); render(); toast('Viewing ' + EMP[state.currentEmp].name + '.'); return; }

  // ----- communication
  const cv = q('[data-comm-view]');
  if (cv) { state.commView = cv.dataset.commView; renderComm(); return; }
  const cf = q('[data-comm-filter]');
  if (cf) { state.commFilter = cf.dataset.commFilter; state.commPage = 0; renderComm(); return; }
  const ct = q('[data-comm-toggle]');
  if (ct) { const id = ct.dataset.commToggle; state.commOpen[id] = !state.commOpen[id]; renderComm(); return; }
  const em = q('[data-email]');
  if (em) { showEmail(em.dataset.email); return; }
  const act = q('[data-act]');
  if (act) {
    const t = ticketById(act.dataset.id);
    switch (act.dataset.act) {
      case 'print': printPackets([t]); break;
      case 'send': showSendModal(t.id); break;
      case 'remind': remind(t); render(); toast('Reminder sent to ' + t.sup + '.'); break;
      case 'meeting':
        meetingDialog(function (when) { addLog(t, 'meeting', 'Employee, supervisor, union steward', 'Calendar', 'HR meeting scheduled for ' + when); render(); toast('HR meeting logged.'); });
        break;
      case 'complete':
        confirmDialog('Mark ticket complete', 'Mark ticket ' + t.id + ' for ' + EMP[t.emp].name + ' as complete? Do this once the signed copy is back in your hands.', 'Mark complete',
          function () { completeTicket(t); state.commSel.delete(t.id); render(); toast('Ticket ' + t.id + ' marked complete.'); });
        break;
    }
    return;
  }
  if (q('#bulkPrint')) { printPackets(Array.from(state.commSel).map(ticketById)); return; }
  if (q('#bulkRemind')) {
    const sent = Array.from(state.commSel).map(ticketById).filter(function (t) { return t.status === 'sent'; });
    if (!sent.length) { toast('Select tickets that are with a supervisor to send reminders.'); return; }
    sent.forEach(remind); render(); toast('Reminders sent for ' + sent.length + ' ticket' + (sent.length === 1 ? '' : 's') + '.'); return;
  }
  if (q('#bulkComplete')) {
    const openT = Array.from(state.commSel).map(ticketById).filter(function (t) { return OPEN_STATUS.indexOf(t.status) > -1; });
    if (!openT.length) { toast('The selected tickets are already closed.'); return; }
    confirmDialog('Mark tickets complete', 'Mark ' + openT.length + ' ticket' + (openT.length === 1 ? '' : 's') + ' as complete? Do this once the signed copies are back in your hands.', 'Mark complete',
      function () { openT.forEach(function (t) { completeTicket(t); state.commSel.delete(t.id); }); render(); toast(openT.length + ' ticket' + (openT.length === 1 ? '' : 's') + ' marked complete.'); });
    return;
  }

  // ----- daily activity
  const mb = q('.mode-btn');
  if (mb) { setDailyMode(mb.dataset.mode); return; }
  if (q('#dnPrev')) { state.dailyDate = shiftDate(state.dailyDate, -1); renderDaily(); return; }
  if (q('#dnNext')) { if (state.dailyDate !== TODAY) { state.dailyDate = shiftDate(state.dailyDate, 1); renderDaily(); } return; }
  if (q('#dnToday')) { state.dailyDate = TODAY; renderDaily(); return; }
  if (q('#rangeApplyBtn')) {
    const f = document.getElementById('rangeFromInput').value, t = document.getElementById('rangeToInput').value;
    if (!f || !t) { toast('Please choose both a from and to date.'); return; }
    if (f > t) { toast('The from date must be before the to date.'); return; }
    state.rangeFrom = fromISO(f); state.rangeTo = fromISO(t); renderDaily(); toast('Range applied.'); return;
  }
  if (q('#printDayBtn')) { if (!document.getElementById('printDayBtn').disabled) printPackets(dailyTickets()); return; }
  if (q('#exportPdfBtn')) { if (!document.getElementById('exportPdfBtn').disabled) exportListPdf(); return; }
  if (q('#exportExcelBtn')) { if (!document.getElementById('exportExcelBtn').disabled) exportExcel(); return; }

  // ----- employee tab
  if (q('#syncBtn')) {
    const pill = document.getElementById('syncBtn');
    pill.classList.add('spin'); document.getElementById('syncLabel').textContent = 'Syncing...';
    setTimeout(function () { pill.classList.remove('spin'); document.getElementById('syncLabel').textContent = 'Synced'; toast('Tile data refreshed from UKG Pro WFM.'); }, 650);
    return;
  }
  if (q('#empRefreshBtn')) {
    const btn = document.getElementById('empRefreshBtn'); btn.classList.add('spin');
    setTimeout(function () { btn.classList.remove('spin'); toast('Refreshed data for ' + EMP[state.currentEmp].name + '.'); }, 550);
    return;
  }
  if (q('#empHistoryBtn')) { showHistory(state.currentEmp, false); return; }
  if (q('#ticketsBadge')) { showHistory(state.currentEmp, true); return; }
  if (q('#empSearchClear')) {
    const input = document.getElementById('empSearchInput');
    input.value = ''; input.focus(); renderEmpMenu(''); setMenuOpen(true); document.getElementById('empSearchClear').classList.remove('show'); return;
  }
  const sw = q('[data-switch]');
  if (sw) { state.currentEmp = Number(sw.dataset.switch); touchRecent(state.currentEmp); state.openTracks = {}; state.searchFocused = false; setMenuOpen(false); document.getElementById('empSearchBox').classList.remove('focused'); render(); toast('Switched to ' + EMP[state.currentEmp].name + '.'); return; }
  if (q('#identityBtn')) {
    const emp = EMP[state.currentEmp];
    openModal('Employee profile',
      '<div class="mrow"><div class="k">Name</div><div class="v">' + esc(emp.name) + '</div></div>' +
      '<div class="mrow"><div class="k">Employee ID</div><div class="v mono">' + state.currentEmp + '</div></div>' +
      '<div class="mrow"><div class="k">Department</div><div class="v">' + esc(emp.dept) + '</div></div>' +
      '<div class="mrow"><div class="k">Shift</div><div class="v">' + emp.shift + '</div></div>' +
      '<div class="mrow"><div class="k">Supervisor</div><div class="v">' + esc(emp.supervisor) + '</div></div>' +
      '<div class="mrow"><div class="k">Hire date</div><div class="v mono">' + emp.hire + '</div></div>' +
      '<div class="mrow"><div class="k">Union</div><div class="v">' + emp.union + '</div></div>',
      '<button class="btn ghost" id="closeBtn1">Close</button>');
    return;
  }
  const tg = q('[data-toggle]');
  if (tg) { state.openTracks[tg.dataset.toggle] = !state.openTracks[tg.dataset.toggle]; renderEmployee(); return; }
  const nb = q('[data-note]');
  if (nb) {
    const key = nb.dataset.note, empId = state.currentEmp;
    noteDialog(function (text) {
      const k = empId + ':' + key;
      (state.notes[k] = state.notes[k] || []).unshift({ date: TODAY, author: 'You', text: text });
      state.openTracks[key] = true; renderEmployee(); toast('Note added.');
    });
    return;
  }

  // ----- modal
  if (q('#modalClose') || T.id === 'closeBtn1' || T.id === 'closeBtn2' || T.id === 'overlay') { closeModal(); return; }

  // ----- close search menu on outside click
  if (!q('.search-wrap')) {
    setMenuOpen(false);
    document.getElementById('empSearchBox').classList.remove('focused');
    state.searchFocused = false;
    document.getElementById('empSearchInput').value = EMP[state.currentEmp].name + ' (#' + state.currentEmp + ')';
  }
});

document.addEventListener('change', function (e) {
  const T = e.target;
  if (T.dataset && T.dataset.pagesize) {
    const kind = T.dataset.pagesize, v = Number(T.value);
    if (kind === 'comm') { state.commSize = v; state.commPage = 0; renderComm(); }
    else if (kind === 'email') { state.emailSize = v; state.emailPage = 0; renderComm(); }
    else if (kind === 'bl') { state.blSize = v; state.blPage = 0; renderByLevel(); }
    else { state.dailySize = v; state.dailyPage = 0; renderDaily(); }
    return;
  }
  if (['blDept', 'blShift', 'blSup', 'blStatus', 'blSort'].indexOf(T.id) > -1) { state[T.id] = T.value; state.blPage = 0; renderByLevel(); return; }
  if (T.id === 'emailOpenOnly') { state.emailOpenOnly = T.checked; state.emailPage = 0; renderComm(); return; }
  if (T.id === 'emailJump') {
    if (!T.value) return;
    const target = fromISO(T.value), I = idx();
    let dates = Array.from(I.byDate.keys()).sort(function (a, b) { return cmpDate(b, a); });
    if (state.emailOpenOnly) dates = dates.filter(function (d) { return I.byDate.get(d).some(function (t) { return OPEN_STATUS.indexOf(t.status) > -1; }); });
    let i = dates.findIndex(function (d) { return cmpDate(d, target) <= 0; });
    if (i < 0) i = dates.length - 1;
    state.emailPage = Math.floor(i / state.emailSize); renderComm(); return;
  }
  if (T.matches && T.matches('[data-sel]')) {
    if (T.checked) state.commSel.add(T.dataset.sel); else state.commSel.delete(T.dataset.sel);
    renderComm(); return;
  }
  if (T.id === 'commSelectAll') {
    commFiltered().slice(state.commPage * state.commSize, (state.commPage + 1) * state.commSize).forEach(function (t) { if (T.checked) state.commSel.add(t.id); else state.commSel.delete(t.id); });
    renderComm();
  }
});

const searchInput = document.getElementById('empSearchInput');
let kbIndex = -1;
function menuOptions() { return Array.from(document.querySelectorAll('#empMenu .opt')); }
function setKb(i) {
  const opts = menuOptions();
  opts.forEach(function (o, n) { o.classList.toggle('kb', n === i); });
  kbIndex = i;
  if (opts[i]) { searchInput.setAttribute('aria-activedescendant', opts[i].id); opts[i].scrollIntoView({ block: 'nearest' }); } else searchInput.removeAttribute('aria-activedescendant');
}
function setMenuOpen(open) { document.getElementById('empMenu').classList.toggle('open', open); searchInput.setAttribute('aria-expanded', open ? 'true' : 'false'); if (!open) setKb(-1); }
searchInput.addEventListener('focus', function () {
  state.searchFocused = true;
  document.getElementById('empSearchBox').classList.add('focused');
  searchInput.select(); renderEmpMenu(''); setMenuOpen(true);
});
const onSearchInput = debounce(function () { renderEmpMenu(searchInput.value); setMenuOpen(true); setKb(-1); }, 90);
searchInput.addEventListener('input', function () {
  document.getElementById('empSearchClear').classList.toggle('show', !!searchInput.value);
  onSearchInput();
});
searchInput.addEventListener('keydown', function (e) {
  const opts = menuOptions();
  if (e.key === 'ArrowDown') { e.preventDefault(); setMenuOpen(true); setKb(Math.min(opts.length - 1, kbIndex + 1)); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); setKb(Math.max(0, kbIndex - 1)); return; }
  if (e.key === 'Escape') { setMenuOpen(false); searchInput.blur(); return; }
  if (e.key === 'Enter') { onSearchInput.flush(); const o2 = menuOptions(); const pick = o2[kbIndex] || o2[0]; if (pick) pick.click(); }
});
const onCommSearch = debounce(function () { renderComm(); }, 120);
document.getElementById('commSearch').addEventListener('input', function (e) { state.commQuery = e.target.value; state.commPage = 0; onCommSearch(); });
const onBlSearch = debounce(function () { renderByLevel(); }, 120);
document.getElementById('blSearch').addEventListener('input', function (e) { state.blQuery = e.target.value; state.blPage = 0; onBlSearch(); });

/* keyboard: Esc closes the top layer, Tab stays inside it, arrows move between tabs */
document.addEventListener('keydown', function (e) {
  const top = layers[layers.length - 1];
  if (top) {
    if (e.key === 'Escape') { e.preventDefault(); if (top.ov.id === 'dlgOverlay') cancelDialog(); else closeModal(); return; }
    if (e.key === 'Tab') {
      const f = focusables(top.ov.firstElementChild);
      if (!f.length) { e.preventDefault(); return; }
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      return;
    }
    if (e.key === 'Enter' && top.ov.id === 'dlgOverlay' && e.target.matches('input[type="datetime-local"],input[type="text"]')) { e.preventDefault(); const p = document.querySelector('#dlgFoot .btn.primary'); if (p) p.click(); }
    return;
  }
  const tabEl = e.target.closest && e.target.closest('.tab-btn');
  if (tabEl && ['ArrowRight', 'ArrowLeft', 'Home', 'End'].indexOf(e.key) > -1) {
    const tabs = Array.from(document.querySelectorAll('.tab-btn'));
    let i = tabs.indexOf(tabEl);
    i = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    e.preventDefault(); tabs[i].focus(); switchTab(tabs[i].dataset.tab);
  }
});
document.getElementById('singleDateInput').addEventListener('change', function (e) {
  if (!e.target.value) return;
  state.dailyDate = fromISO(e.target.value); renderDaily();
});

/* ================================================================
   INIT
   ================================================================ */
document.getElementById('singleDateInput').max = toISO(TODAY);
document.getElementById('rangeFromInput').value = toISO(state.rangeFrom);
document.getElementById('rangeToInput').value = toISO(state.rangeTo);
loadCalMode();
initByLevelControls();
render();

/* embed mode: inside an iframe (or with ?embed=1) the host supplies the frame, so drop page padding and report the height */
(function () {
  let embedded = false;
  try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
  if (/[?&]embed=1/.test(location.search)) embedded = true;
  if (!embedded) return;
  document.documentElement.classList.add('embedded');
  if (!window.ResizeObserver) return;
  let last = 0;
  new ResizeObserver(function () {
    const h = Math.ceil(document.documentElement.scrollHeight);
    if (Math.abs(h - last) > 2) { last = h; try { window.parent.postMessage({ source: 'cloudapper-attendance-tile', type: 'resize', height: h }, '*'); } catch (e) { /* host blocks messaging */ } }
  }).observe(document.body);
})();
